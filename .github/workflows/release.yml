name: Release

# Cutting a release means moving the `release` branch, because that is the ref
# coworkers' pi installs track:
#
#   pi install git:github.com/jserra7d5/bravo-pi-mono#release
#
# pi compares their local HEAD against that ref, so `release` moving IS the release.
# Nothing is published to a registry. Tag when you mean it:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The gates run against the tagged commit first. A tag that fails them never reaches
# anyone — `release` simply does not move, and installs stay on the last good commit.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit or tag to release'
        required: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # Same gates as CI. A release is not a separate quality bar, it is the same bar
      # applied to the commit that coworkers will actually run.
      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test --workspaces --if-present

      # Proves the thing being released can actually be consumed the way coworkers
      # consume it: a clean `npm install --omit=dev` plus the prepare hook, ending in
      # the supervisor binary async-subagents refuses to start without. This is the
      # check that would have caught a devDependency creeping into the build path.
      - name: Verify the install path a coworker gets
        run: |
          set -euo pipefail
          consumer="$(mktemp -d)"
          git clone --depth 1 --no-local "$GITHUB_WORKSPACE" "$consumer"
          cd "$consumer"
          npm install --omit=dev
          test -f packages/async-subagents/dist/src/cli.js \
            || { echo "::error::supervisor CLI missing after --omit=dev install; async-subagents would refuse to start"; exit 1; }
          node packages/async-subagents/dist/src/cli.js --version

      - name: Move the release branch
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "Releasing $sha"
          git push --force-with-lease origin "$sha:refs/heads/release"

      - name: Summary
        run: |
          {
            echo "### Released \`$(git rev-parse --short HEAD)\` to \`release\`"
            echo
            echo "Coworkers pick it up with:"
            echo
            echo '```sh'
            echo 'pi update --extensions'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
