name: Release

# Publishing only. This workflow runs no tests, no type-check, and no build —
# by design. Validation happens locally before you tag:
#
#   npm run check && npm test --workspaces
#
# What it does is move the `release` branch, which is the ref coworkers' pi
# installs track:
#
#   pi install git:github.com/jserra7d5/bravo-pi-mono
#
# `release` is the repo's default branch, so a no-ref install follows it. pi
# compares their local HEAD against it and surfaces an available update on
# startup, so `release` moving IS the release.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Because nothing is gated here, whatever you tag reaches everyone. Tag commits
# you have actually run.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit or tag to release'
        required: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Move the release branch
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "Releasing $sha"
          git push --force-with-lease origin "$sha:refs/heads/release"

      - name: Summary
        run: |
          {
            echo "### Released \`$(git rev-parse --short HEAD)\` to \`release\`"
            echo
            echo "Coworkers pick it up with:"
            echo
            echo '```sh'
            echo 'pi update --extensions'
            echo '```'
            echo
            echo "_No gates ran. This is whatever was tagged._"
          } >> "$GITHUB_STEP_SUMMARY"
